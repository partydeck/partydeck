name: CI (Arch)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Arch image
        run: |
          docker build \
            --build-arg UID=$(id -u) \
            --build-arg GID=$(id -g) \
            -t partydeck-arch-build \
            -f dist/Dockerfile.arch .

      - name: Build release skeleton
        run: docker run --rm -v "$PWD:/workspace" partydeck-arch-build

      - name: Create tarball
        run: |
          tar -czf "partydeck-UNOFFICIAL-ARCH-TEST-steamdeck-x86_64.tar.gz" \
              -C dist/build_generated/arch release/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: built-UNOFFICIAL-binaries-arch
          path: |
            partydeck-UNOFFICIAL-ARCH-TEST-steamdeck-x86_64.tar.gz
