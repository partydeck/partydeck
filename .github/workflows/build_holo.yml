name: CI (Holo / Steam Deck)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Holo image
        run: |
          docker build \
            --build-arg UID=$(id -u) \
            --build-arg GID=$(id -g) \
            -t partydeck-holo \
            -f dist/Dockerfile.holo .

      - name: Build release skeleton
        run: docker run --rm -v "$PWD:/workspace" partydeck-holo

      - name: Create tarball
        run: |
          tar -czf "partydeck-HOLO-TEST-steamdeck-x86_64.tar.gz" \
              -C dist/build/holo release/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: built-binaries-holo
          path: |
            partydeck-HOLO-TEST-steamdeck-x86_64.tar.gz
