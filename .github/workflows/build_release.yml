name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version string for artifact names (e.g. v1.2.3).
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: ghcr.io/steamdeckhomebrew/holo-toolchain-rust@sha256:818de45e147f35798c66498380b31bd1fe8bf75afdf0a22b027053706836faf1
    steps:
      # The Holo image ships no git; Install before checkout.
      - name: Install git
        run: pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Resolve version
        id: version
        shell: bash
        run: echo "value=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: ./.github/actions/build-partydeck
        with:
          version: ${{ steps.version.outputs.value }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.tarball }}
            ${{ steps.build.outputs.appimage }}
