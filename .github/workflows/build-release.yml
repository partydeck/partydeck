name: Build Release

on:
  push:
    tags:
      - "v*"

jobs:
  # SteamOS-targeted tarball: built on Holo so binaries link against the Deck's packages.
  build-tarball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Holo image
        run: |
          docker build \
            --build-arg UID=$(id -u) \
            --build-arg GID=$(id -g) \
            -t partydeck-holo \
            -f dist/Dockerfile.holo .

      - name: Build release skeleton
        run: docker run --rm -v "$PWD:/workspace" partydeck-holo

      - name: Create tarball
        run: |
          TAG="${GITHUB_REF_NAME}"
          tar -czf "partydeck-${TAG}-steamos-x86_64.tar.gz" \
              --transform='s,^release,partydeck,' \
              -C dist/build/holo release/

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: partydeck-*-steamos-x86_64.tar.gz
          if-no-files-found: error

  # AppImage bundles its own libs via sharun, so it's OS-agnostic. Built
  # on Arch because Holo lacks the gcc-libs packaging.
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Arch image
        run: |
          docker build \
            --build-arg UID=$(id -u) \
            --build-arg GID=$(id -g) \
            -t partydeck-arch \
            -f dist/Dockerfile .

      - name: Build AppImage
        run: docker run --rm -v "$PWD:/workspace" partydeck-arch

      - name: Stage AppImage with tag name
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp dist/appimage_generated/partydeck-anylinux-x86_64.AppImage \
             "partydeck-${TAG}-anylinux-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: partydeck-*-anylinux-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [build-tarball, build-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            partydeck-*-steamos-x86_64.tar.gz
            partydeck-*-anylinux-x86_64.AppImage
          generate_release_notes: true
